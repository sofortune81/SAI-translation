<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>海天地悅旅集團 2025 年報（中譯稿）</title>
<style>
  :root { color-scheme: light dark; --bg:#fbfbf9; --fg:#1c1c1a; --muted:#6b6b64; --rule:#e2e1db; --card:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#17171a; --fg:#e8e8e4; --muted:#9a9a93; --rule:#33333a; --card:#1e1e22; }
  }
  * { box-sizing: border-box; }
  body {
    margin:0; background:var(--bg); color:var(--fg);
    font-family:"Noto Serif TC","Source Han Serif TC","PingFang TC","Microsoft JhengHei",
                "Hiragino Sans TC",serif;
    font-size:16px; line-height:1.85;
  }
  header.site {
    padding:2.5rem 1rem 1.75rem; border-bottom:1px solid var(--rule);
    text-align:center; background:var(--card);
  }
  header.site h1 { margin:0 0 .4rem; font-size:1.35rem; letter-spacing:.02em; }
  header.site p { margin:0; color:var(--muted); font-size:.85rem; line-height:1.6; }
  main { max-width:820px; margin:0 auto; padding:2rem 1rem 5rem; }
  .page {
    background:var(--card); border:1px solid var(--rule); border-radius:10px;
    padding:2rem 1.75rem; margin:0 0 1.5rem; position:relative; overflow-wrap:anywhere;
  }
  .page::after {
    content:"第 " attr(data-page) " 頁"; position:absolute; top:.7rem; right:1rem;
    font-size:.7rem; color:var(--muted); letter-spacing:.06em;
  }
  .page h1 { font-size:1.2rem; margin:.2rem 0 1rem; padding-bottom:.5rem; border-bottom:1px solid var(--rule); }
  .page h2 { font-size:1.02rem; margin:1.6rem 0 .6rem; }
  .page h3 { font-size:.92rem; margin:1.2rem 0 .4rem; color:var(--muted); font-weight:600; }
  .page p  { margin:0 0 .85rem; }
  table { width:100%; border-collapse:collapse; margin:1rem 0; font-size:.88rem; }
  th, td { border:1px solid var(--rule); padding:.45rem .6rem; text-align:left; vertical-align:top; }
  th { background:rgba(128,128,128,.08); font-weight:600; }
  .tablewrap { overflow-x:auto; }
  .status { text-align:center; color:var(--muted); font-size:.85rem; }
  .status.error { color:#c0392b; }
  @media (max-width:600px) { .page { padding:1.5rem 1.1rem; } body { font-size:15px; } }
</style>
</head>
<body>
<header class="site">
  <h1>海天地悅旅集團有限公司 · 2025 年報</h1>
  <p>S.A.I. LEISURE GROUP COMPANY LIMITED（股份代號：1832）<br>
     英文 → 繁體中文翻譯稿<span id="range"></span></p>
</header>
<main>
<p id="status" class="status">載入中…</p>
<noscript><p class="status">此頁面需啟用 JavaScript 以載入譯文。</p></noscript>
</main>
<script>
/* [FEATURE: chunk stitching]
   SEARCH TAGS: chunk, stitch, chunkN.html, fetch, page range
   Translation arrives as chunk1.html, chunk2.html, … with no known upper bound, so the
   page discovers them: fetch in sequence and stop at the first 404. Publishing a new
   section is just adding the next chunkN.html — this file never changes.
   Sequential (not parallel) because the count is unknown and order must be preserved.
   Needs http(s): fetch() is blocked on file://, so preview with `python3 -m http.server`. */
(async function stitchChunks() {
  const main = document.querySelector('main');
  const status = document.getElementById('status');
  try {
    let n = 1;
    for (;; n++) {
      const res = await fetch('chunk' + n + '.html');
      if (res.status === 404) break;   // end of the sequence
      // Any other failure is a real error: a silent stop would publish a truncated report.
      if (!res.ok) throw new Error('chunk' + n + '.html: HTTP ' + res.status);
      status.insertAdjacentHTML('beforebegin', await res.text());
    }
    if (n === 1) throw new Error('chunk1.html not found');
    const pages = main.querySelectorAll('.page[data-page]');
    if (pages.length) {
      document.getElementById('range').textContent =
        ' · 第 ' + pages[0].dataset.page + '–' + pages[pages.length - 1].dataset.page + ' 頁';
    }
    status.remove();
  } catch (err) {
    status.classList.add('error');
    status.textContent = '譯文載入失敗：' + err.message;
    console.error(err);
  }
})();
</script>
<footer style="text-align:center;padding:0 1rem 3rem;color:var(--muted);font-size:.78rem;line-height:1.7">機器輔助翻譯稿，僅供審閱之用。<br>本年度報告的中英文版本如有任何歧義，概以英文版本為準。</footer>
</body>
</html>
